<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root { --red: #F9033D; --cream: #FCF6EB; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--cream);
  color: var(--cream);
  font-family: 'Fraunces', serif;
  font-weight: 900;
  font-size: min(300px, 22vw);
  /* solid extruded shadow down and to the right, one layer per step */

    0.003em 0.0024em 0 var(--red),
    0.006em 0.0048em 0 var(--red),
    0.009em 0.0072em 0 var(--red),
    0.012em 0.0096em 0 var(--red),
    0.015em 0.0120em 0 var(--red),
    0.018em 0.0144em 0 var(--red),
    0.021em 0.0168em 0 var(--red),
    0.024em 0.0192em 0 var(--red),
    0.027em 0.0216em 0 var(--red),
    0.030em 0.0240em 0 var(--red),
    0.033em 0.0264em 0 var(--red),
    0.036em 0.0288em 0 var(--red),
    0.039em 0.0312em 0 var(--red),
    0.042em 0.0336em 0 var(--red),
    0.045em 0.0360em 0 var(--red),
    0.048em 0.0384em 0 var(--red),
    0.051em 0.0408em 0 var(--red),
    0.054em 0.0432em 0 var(--red),
    0.057em 0.0456em 0 var(--red),
    0.060em 0.0480em 0 var(--red),
    0.063em 0.0504em 0 var(--red),
    0.066em 0.0528em 0 var(--red),
    0.069em 0.0552em 0 var(--red),
    0.072em 0.0576em 0 var(--red),
    0.075em 0.0600em 0 var(--red),
    0.078em 0.0624em 0 var(--red),
    0.081em 0.0648em 0 var(--red),
    0.084em 0.0672em 0 var(--red),
    0.087em 0.0696em 0 var(--red),
    0.090em 0.0720em 0 var(--red),
    0.093em 0.0744em 0 var(--red),
    0.096em 0.0768em 0 var(--red),
    0.099em 0.0792em 0 var(--red),
    0.102em 0.0816em 0 var(--red),
    0.105em 0.0840em 0 var(--red),
    0.108em 0.0864em 0 var(--red),
    0.111em 0.0888em 0 var(--red),
    0.114em 0.0912em 0 var(--red),
    0.117em 0.0936em 0 var(--red),

    0.138em 0.1104em 0 var(--red),
    0.141em 0.1128em 0 var(--red),
    0.144em 0.1152em 0 var(--red),
    0.147em 0.1176em 0 var(--red),
    0.150em 0.1200em 0 var(--red);
}
</style>
</head>
<body>
Mascot
</body>
</html>
