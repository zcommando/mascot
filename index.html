<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Damion&display=swap" rel="stylesheet">
<style>
:root { --red: #F9033D; --cream: #FEFBF6; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--cream);
}
h1 {
  margin: 0;
  /* the script's overhangs (the t's crossbar) reach past the text box; padding keeps
     them inside the filter region, which Safari clips to */
  padding: 0.1em 0.15em;
  color: var(--cream);
  font-family: 'Damion', cursive;
  font-weight: 400;
  font-size: min(300px, 27vw);
  /* red outline; drawn behind the fill so only its outer half shows */
  -webkit-text-stroke: 0.035em var(--red);
  paint-order: stroke fill;
  /* #close fills hairline gaps (the notch atop the s) before the extrusion is cast.
     Solid extrusion down and to the right, cast from the outlined letters.
     Each drop-shadow copies everything before it, so offsets of 1, 2, 4 … 32
     steps add up to one continuous 63-step block. */
  filter:
    url(#close)
    drop-shadow(0.0025em 0.002em 0 var(--red))
    drop-shadow(0.005em 0.004em 0 var(--red))
    drop-shadow(0.01em 0.008em 0 var(--red))
    drop-shadow(0.02em 0.016em 0 var(--red))
    drop-shadow(0.04em 0.032em 0 var(--red))
    drop-shadow(0.08em 0.064em 0 var(--red));
}
</style>
</head>
<body>
<h1>Mascot</h1>
<!-- morphological closing: grow the letter silhouette 3px, shrink it back, and paint
     whatever got filled in red beneath the letters -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="close" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
    <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="grown"/>
    <feMorphology in="grown" operator="erode" radius="3" result="closed"/>
    <feFlood flood-color="#F9033D"/>
    <feComposite in2="closed" operator="in" result="fill"/>
    <feMerge><feMergeNode in="fill"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</svg>
</body>
</html>
